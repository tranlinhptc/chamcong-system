<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chấm công tác</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="congtac.css">
</head>
<body class="page-ct">

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">📝</span>
    <span class="title">Chấm công tác</span>
  </div>
  <div class="topbar-right">
    <button class="btn btn-sm" onclick="location.href='home.html'">🏠</button>
    <button class="btn btn-sm btn-danger" onclick="doLogout()">Thoát</button>
  </div>
</div>

<!-- 5 TAB COMPACT -->
<div class="tabs-ct">
  <button class="tab-ct active" onclick="switchTab(0,this)"><b>📋</b><small>Công tác</small></button>
  <button class="tab-ct" onclick="switchTab(1,this)"><b>💤</b><small>Nghỉ</small></button>
  <button class="tab-ct" onclick="switchTab(2,this)"><b>🔄</b><small>Nghỉ bù</small></button>
  <button class="tab-ct" onclick="switchTab(3,this)"><b>☢️</b><small>Độc hại</small></button>
  <button class="tab-ct" onclick="switchTab(4,this)"><b>📊</b><small>Tổng hợp</small></button>
</div>

<div class="container-ct">

  <!-- ===== TAB 0: CÔNG TÁC ===== -->
  <div class="tab-content active" id="tab0">

    <div class="card-ct">
      <div class="field">
        <label>Ngày chấm:</label>
        <input type="date" id="fNgay" onchange="updatePreviewCT()">
      </div>
      <div class="radio-group">
        <label><input type="radio" name="loaiChinh" value="SX" onchange="onLoaiChinhChange()"> SX</label>
        <label><input type="radio" name="loaiChinh" value="SCL" onchange="onLoaiChinhChange()"> SCL</label>
        <label><input type="radio" name="loaiChinh" value="ĐTXD" onchange="onLoaiChinhChange()"> ĐTXD</label>
      </div>
      <div class="field" id="fieldHangMucCT" style="display:none">
        <label>Hạng mục:</label>
        <select id="fHangMucCT"></select>
      </div>
    </div>

    <!-- Di chuyển đi -->
    <div class="card-ct">
      <div class="card-head">
        <h3>🚗 Di chuyển đi</h3>
        <label class="toggle">
          <input type="checkbox" id="cbDiChuyenDi" onchange="toggleBlock('blockDiChuyenDi', this.checked, 'diChuyenDi')">
          <span>Có</span>
        </label>
      </div>
      <div id="blockDiChuyenDi" style="display:none">
        <div class="grid-2">
          <div class="field">
            <label>Từ:</label>
            <input type="datetime-local" id="dcdTu" onchange="updatePreviewCT()">
          </div>
          <div class="field">
            <label>Đến:</label>
            <input type="datetime-local" id="dcdDen" onchange="updatePreviewCT()">
          </div>
        </div>
        <div class="chip-wrap" id="blockDiChuyenDi_wrap">
          <div class="chip-tools">
            <button onclick="selectAllBlock('blockDiChuyenDi_wrap')">✅ Tất cả</button>
            <button onclick="clearAllBlock('blockDiChuyenDi_wrap')">❌ Bỏ</button>
          </div>
          <div class="chip-grid" id="chipDCD"></div>
          <div class="chip-info">Đã chọn: <b class="chip-count">0</b></div>
        </div>
      </div>
    </div>

    <!-- Danh sách công tác -->
    <div class="card-ct">
      <div class="card-head">
        <h3>🔧 Công tác chính</h3>
        <button class="btn btn-primary btn-sm" onclick="addCongTac()">+ Thêm</button>
      </div>
      <div id="listCongTac"></div>
    </div>

    <!-- Di chuyển về -->
    <div class="card-ct">
      <div class="card-head">
        <h3>🚗 Di chuyển về</h3>
        <label class="toggle">
          <input type="checkbox" id="cbDiChuyenVe" onchange="toggleBlock('blockDiChuyenVe', this.checked, 'diChuyenVe')">
          <span>Có</span>
        </label>
      </div>
      <div id="blockDiChuyenVe" style="display:none">
        <div class="grid-2">
          <div class="field">
            <label>Từ:</label>
            <input type="datetime-local" id="dcvTu" onchange="updatePreviewCT()">
          </div>
          <div class="field">
            <label>Đến:</label>
            <input type="datetime-local" id="dcvDen" onchange="updatePreviewCT()">
          </div>
        </div>
        <div class="chip-wrap" id="blockDiChuyenVe_wrap">
          <div class="chip-tools">
            <button onclick="selectAllBlock('blockDiChuyenVe_wrap')">✅ Tất cả</button>
            <button onclick="clearAllBlock('blockDiChuyenVe_wrap')">❌ Bỏ</button>
          </div>
          <div class="chip-grid" id="chipDCV"></div>
          <div class="chip-info">Đã chọn: <b class="chip-count">0</b></div>
        </div>
      </div>
    </div>

    <div class="preview-box">
      <b>📊</b> <span id="previewCTText">0 người • 0h → 0h</span>
    </div>

    <div class="actions-ct">
      <button class="btn" onclick="resetFormCT()">🔄 Mới</button>
      <button class="btn btn-primary" onclick="saveFormCT()">💾 Lưu</button>
    </div>
  </div>

  <!-- ===== TAB 1: NGHỈ ===== -->
  <div class="tab-content" id="tab1">
    <div class="card-ct">
      <div class="field">
        <label>Loại nghỉ:</label>
        <select id="nLoai">
          <option value="P">P — Nghỉ phép</option>
          <option value="Ô">Ô — Nghỉ ốm</option>
          <option value="L">L — Nghỉ lễ</option>
          <option value="BL">BL — Nghỉ bù lễ</option>
          <option value="T">T — Tai nạn LĐ</option>
          <option value="TSn">TSn — Thai sản</option>
          <option value="Cô">Cô — Con ốm</option>
          <option value="R">R — Việc riêng có lương</option>
          <option value="NM">NM — Nghỉ mát</option>
          <option value="KL">KL — Không lương</option>
          <option value="NKL">NKL — Nghỉ việc không lương</option>
          <option value="Ko">Ko — Không lý do</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Từ ngày:</label>
          <input type="date" id="nTuNgay" onchange="updatePreviewNghi()">
        </div>
        <div class="field">
          <label>Đến ngày:</label>
          <input type="date" id="nDenNgay" onchange="updatePreviewNghi()">
        </div>
      </div>
      <div class="field">
        <label>Lý do:</label>
        <input type="text" id="nLyDo" placeholder="VD: Nghỉ phép năm">
      </div>
    </div>

    <div class="card-ct">
      <div class="chip-wrap" id="blockNghi">
        <div class="chip-tools">
          <button onclick="selectAllBlock('blockNghi')">✅ Tất cả</button>
          <button onclick="clearAllBlock('blockNghi')">❌ Bỏ</button>
        </div>
        <div class="chip-grid" id="chipNghi"></div>
        <div class="chip-info">Đã chọn: <b class="chip-count">0</b></div>
      </div>

      <div class="preview-box">
        <b>📊</b> <span id="previewNghiText">0 người × 0 ngày</span>
      </div>

      <div class="actions-ct">
        <button class="btn" onclick="resetFormNghi()">🔄 Mới</button>
        <button class="btn btn-primary" onclick="saveFormNghi()">💾 Lưu nghỉ</button>
      </div>
    </div>
  </div>

  <!-- ===== TAB 2: NGHỈ BÙ ===== -->
  <div class="tab-content" id="tab2">
    <div class="card-ct">
      <div class="grid-2">
        <div class="field">
          <label>Từ ngày:</label>
          <input type="date" id="nbTuNgay">
        </div>
        <div class="field">
          <label>Đến ngày:</label>
          <input type="date" id="nbDenNgay">
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Số giờ:</label>
          <select id="nbSoGio" onchange="updatePreviewNghiBu()">
            <option value="8">8 giờ</option>
            <option value="4">4 giờ</option>
            <option value="6">6 giờ</option>
            <option value="2">2 giờ</option>
          </select>
        </div>
        <div class="field">
          <label>⚠️ Trừ vào tháng:</label>
          <input type="month" id="nbThangTruGio" onchange="updatePreviewNghiBu()">
        </div>
      </div>
      <div class="field">
        <label>Lý do:</label>
        <input type="text" id="nbLyDo" placeholder="VD: Nghỉ bù công tác T9">
      </div>
    </div>

    <div class="card-ct">
      <div class="chip-wrap" id="blockNghiBu">
        <div class="chip-tools">
          <button onclick="selectAllBlock('blockNghiBu')">✅ Tất cả</button>
          <button onclick="clearAllBlock('blockNghiBu')">❌ Bỏ</button>
        </div>
        <div class="chip-grid" id="chipNghiBu"></div>
        <div class="chip-info">Đã chọn: <b class="chip-count">0</b></div>
      </div>

      <div class="preview-box">
        <b>📊</b> <span id="previewNghiBuText">0 người × 8h</span>
      </div>

      <div class="actions-ct">
        <button class="btn" onclick="resetFormNghiBu()">🔄 Mới</button>
        <button class="btn btn-primary" onclick="saveFormNghiBu()">💾 Lưu</button>
      </div>
    </div>
  </div>

  <!-- ===== TAB 3: ĐỘC HẠI ===== -->
  <div class="tab-content" id="tab3">
    <div class="card-ct">
      <div class="field">
        <label>Mức độ:</label>
        <select id="dhMucDo">
          <option value="DH">DH — Cả ngày</option>
          <option value="½DH">½DH — Nửa ngày</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Từ ngày:</label>
          <input type="date" id="dhTuNgay">
        </div>
        <div class="field">
          <label>Đến ngày:</label>
          <input type="date" id="dhDenNgay">
        </div>
      </div>
      <div class="field">
        <label>Ghi chú:</label>
        <input type="text" id="dhGhiChu" placeholder="VD: Môi trường độc hại">
      </div>
    </div>

    <div class="card-ct">
      <div class="chip-wrap" id="blockDocHai">
        <div class="chip-tools">
          <button onclick="selectAllBlock('blockDocHai')">✅ Tất cả</button>
          <button onclick="clearAllBlock('blockDocHai')">❌ Bỏ</button>
        </div>
        <div class="chip-grid" id="chipDocHai"></div>
        <div class="chip-info">Đã chọn: <b class="chip-count">0</b></div>
      </div>

      <div class="actions-ct">
        <button class="btn" onclick="resetFormDocHai()">🔄 Mới</button>
        <button class="btn btn-primary" onclick="saveFormDocHai()">💾 Lưu</button>
      </div>
    </div>
  </div>

  <!-- ===== TAB 4: TỔNG HỢP ===== -->
  <div class="tab-content" id="tab4">
    <div class="card-ct">
      <div class="grid-2">
        <div class="field">
          <label>Tháng:</label>
          <input type="month" id="tThang">
        </div>
        <div class="field">
          <label>Loại CT:</label>
          <div class="checkbox-group" style="padding-top:8px">
            <label><input type="checkbox" class="tLoai" value="SX" checked> SX</label>
            <label><input type="checkbox" class="tLoai" value="SCL" checked> SCL</label>
            <label><input type="checkbox" class="tLoai" value="ĐTXD" checked> ĐTXD</label>
          </div>
        </div>
      </div>
      <div class="actions-ct" style="margin-top:10px">
        <button class="btn btn-primary" onclick="loadTongHop()">🔄 Tải dữ liệu</button>
        <button class="btn btn-success" onclick="exportExcel()">📊 Excel</button>
      </div>
    </div>

    <div id="tongHopWrap"></div>
  </div>

</div>

<div id="loading" class="loading-overlay" style="display:none">
  <div class="loading-box">⏳ Đang xử lý...</div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="api.js"></script>
<script src="congtac.js"></script>
</body>
</html>
