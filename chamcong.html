<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng chấm công</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chamcong.css">
</head>
<body class="page-chamcong">

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">🕒</span>
    <span class="title">Bảng chấm công</span>
  </div>
  <div class="topbar-right">
    <span id="userInfo" class="user-info">...</span>
    <button class="btn btn-sm" onclick="goHome()">🏠 Trang chủ</button>
    <button class="btn btn-sm btn-danger" onclick="doLogout()">Đăng xuất</button>
  </div>
</div>

<div class="toolbar">
  <label>Tháng:</label>
  <input type="month" id="monthPicker" onchange="loadMonth()">

  <button class="btn btn-primary" id="btnSave" onclick="saveAll()" disabled>
    💾 Lưu thay đổi
  </button>
  <button class="btn btn-success" onclick="exportExcel()">
    📊 Xuất Excel
  </button>
  <button class="btn" onclick="showLegend()">
    📖 Chú thích
  </button>

  <span id="statusMsg" class="status-msg"></span>
</div>

<div class="info-bar" id="infoBar">
  <span id="roleBadge" class="badge"></span>
  <span id="hintText"></span>
</div>

<div class="table-wrap">
  <table id="mainTable">
    <thead id="tableHead"></thead>
    <tbody id="tableBody">
      <tr><td colspan="40" class="loading">⏳ Đang tải dữ liệu...</td></tr>
    </tbody>
    <tfoot id="tableFoot"></tfoot>
  </table>
</div>

<!-- ============ POPUP CHẤM CÔNG ============ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal modal-wide" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="modalTitle">Chấm công</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <!-- Ký hiệu -->
      <div class="field">
        <label>Ký hiệu:</label>
        <select id="fKyHieu" onchange="onKyHieuChange()"></select>
      </div>

      <!-- Trạm (chỉ hiện với ct/CT1/CT2) -->
      <div class="field" id="fieldTramRow" style="display:none">
        <label>Trạm công tác:</label>
        <select id="fTram" onchange="onTramChange()">
          <option value="">-- Chọn trạm --</option>
          <option value="1">Trạm 1</option>
          <option value="2">Trạm 2</option>
          <option value="3">Trạm 3</option>
          <option value="4">Trạm 4</option>
          <option value="5">Trạm 5</option>
          <option value="6">Trạm 6</option>
          <option value="7">Trạm 7</option>
          <option value="8">Trạm 8</option>
          <option value="9">Trạm 9</option>
          <option value="10">Trạm 10</option>
          <option value="11">Trạm 11</option>
          <option value="12">Trạm 12</option>
          <option value="13">Trạm 13</option>
          <option value="14">Trạm 14</option>
          <option value="15">Trạm 15</option>
          <option value="16">Trạm 16</option>
          <option value="17">Trạm 17</option>
          <option value="18">Trạm 18</option>
          <option value="19">Trạm 19 (không tính CT)</option>
          <option value="20">Trạm 20 (không tính CT)</option>
        </select>
        <div id="ct12Hint" class="hint"></div>
      </div>

      <!-- Từ giờ - Đến giờ -->
      <div class="field-row" id="fieldTimeRow">
        <div class="field">
          <label>Từ giờ:</label>
          <input type="time" id="fTuGio" value="08:00">
        </div>
        <div class="field">
          <label>Đến giờ:</label>
          <input type="time" id="fDenGio" value="17:00">
        </div>
      </div>

      <!-- Công trình (SCL/ĐTXD) — dropdown gợi ý -->
      <div class="field" id="fieldCongTrinhRow" style="display:none">
        <label>Công trình (mã):</label>
        <input type="text" id="fCongTrinh" list="dsCongTrinh"
               placeholder="VD: SCL1, ĐTXD2...">
        <datalist id="dsCongTrinh"></datalist>
        <div class="hint">Gõ mã mới hoặc chọn từ gợi ý</div>
      </div>

      <!-- Tên công việc (SXKD/SCTX) -->
      <div class="field" id="fieldTenCongViecRow" style="display:none">
        <label>Tên công việc:</label>
        <input type="text" id="fTenCongViec"
               placeholder="VD: Lập dự toán, Kéo rải cáp...">
      </div>

      <!-- Ghi chú -->
      <div class="field">
        <label>Ghi chú:</label>
        <textarea id="fMoTa" rows="2" placeholder="Ghi chú (không bắt buộc)"></textarea>
      </div>

      <!-- Preview kết quả -->
      <div id="calcPreview" class="calc-preview"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Hủy</button>
      <button class="btn btn-danger" onclick="deleteCell()" id="btnDelete" style="display:none">
        🗑 Xóa
      </button>
      <button class="btn btn-primary" onclick="confirmCell()">✔ Lưu ô này</button>
    </div>
  </div>
</div>

<!-- ============ POPUP LEGEND ============ -->
<div class="modal-overlay" id="legendOverlay" onclick="closeLegend(event)">
  <div class="modal modal-wide" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3>📖 Chú thích ký hiệu chấm công</h3>
      <button class="modal-close" onclick="closeLegend()">✕</button>
    </div>
    <div class="modal-body" id="legendBody"></div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="closeLegend()">Đóng</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="api.js"></script>
<script src="chamcong.js"></script>
</body>
</html>
