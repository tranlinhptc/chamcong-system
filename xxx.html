<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chấm công</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f0f2f5; font-size:14px; }
    .card { box-shadow:0 4px 12px rgba(0,0,0,.1); border-radius:12px; border:none; }
    .nav-tabs .nav-link.active { font-weight:bold; color:#0d6efd; border-bottom:3px solid #0d6efd; }

    .emp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media (max-width: 768px) { .emp-grid { grid-template-columns: repeat(2, 1fr); } }
    .emp-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; border: 2px solid #dee2e6; border-radius: 8px;
      cursor: pointer; user-select: none; background: #fff;
      transition: all .15s; font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .emp-chip:hover { border-color: #0d6efd; background: #f0f7ff; }
    .emp-chip input { margin: 0; flex-shrink: 0; }
    .emp-chip.checked { border-color: #0d6efd; background: #e7f1ff; }
    .emp-chip.checked span { color:#0d6efd; font-weight:700; }
    .emp-chip span { overflow: hidden; text-overflow: ellipsis; }

    .table-responsive { max-height: 72vh; overflow: auto; border: 1px solid #dee2e6; border-radius: 6px;}
    #monthTable { font-size: 11.5px; margin-bottom: 0;}
    #monthTable th, #monthTable td { padding: 4px 5px; white-space: nowrap; text-align: center; vertical-align: middle; }
    #monthTable th:first-child, #monthTable td:first-child,
    #monthTable th:nth-child(2), #monthTable td:nth-child(2) {
      position: sticky; background: #f8f9fa; z-index: 5;
    }
    #monthTable th:nth-child(1) { left: 0; z-index: 7; }
    #monthTable th:nth-child(2) { left: 55px; z-index: 7; }
    #monthTable td:nth-child(1) { left: 0; background:#f8f9fa; }
    #monthTable td:nth-child(2) { left: 55px; background:#f8f9fa; }
    thead { position: sticky; top: 0; z-index: 6; }
    .col-day { min-width: 42px; max-width: 60px; }
    
    .cell-t7 { background: #fff4e6 !important; }
    .cell-cn { background: #ffe0e0 !important; }
    .cell-le { background: #ffd6d6 !important; font-weight: 600; }
    .cell-work { background: #e7f1ff !important; }
    .cell-leave { background: #e2d9f3 !important; }
    .cell-warn { box-shadow: inset 0 0 0 2px #dc3545; }
    .total-col { background: #e8f5e9 !important; font-weight: 600; }
    .total-hdr { background: #b7dfc0 !important; }
    .quy-col { background: #fff3cd !important; font-weight: 600; color: #d35400; }
  </style>
</head>
<body>

<div class="container-fluid my-4 px-2">
  <h3 class="text-center mb-3 fw-bold text-uppercase text-primary" style="font-size: 1.2rem;">Phần mềm Quản lý Khối lượng & Chấm công</h3>

  <ul class="nav nav-tabs mb-3" style="flex-wrap: nowrap; overflow-x: auto;">
    <li class="nav-item"><button class="nav-link active text-nowrap" data-bs-toggle="tab" data-bs-target="#nhap">📝 Nhập liệu</button></li>
    <li class="nav-item"><button class="nav-link text-nowrap" data-bs-toggle="tab" data-bs-target="#thang" onclick="onTabThang()">📅 Bảng tháng</button></li>
    <li class="nav-item"><button class="nav-link text-nowrap" data-bs-toggle="tab" data-bs-target="#caidat" onclick="loadConfig()">⚙️ Cấu hình</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="nhap">
      <div class="card p-3 mx-auto" style="max-width: 900px;">
        <form id="frm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-bold text-danger">👥 Chọn nhân sự:</label>
            <div class="emp-grid" id="empGrid"></div>
            <div class="mt-2">
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="toggleAll(true)">Chọn tất cả</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="toggleAll(false)">Bỏ chọn</button>
              <span class="ms-2 text-muted">Đã chọn: <b id="cntSelected">0</b></span>
            </div>
          </div>
          <hr>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">Loại công tác:</label>
              <select class="form-select" id="loaiCT" required>
                <optgroup label="Làm việc">
                  <option value="SANXUAT">Sản xuất</option>
                  <option value="SCL">Sửa chữa lớn</option>
                  <option value="DTXD">Đầu tư xây dựng</option>
                  <option value="CT">Công tác CT1/CT2</option>
                </optgroup>
                <optgroup label="Nghỉ / Học">
                  <option value="P">Nghỉ phép (P)</option>
                  <option value="H">Đi học (H)</option>
                  <option value="NGHIBU">Nghỉ bù</option>
                  <option value="DIEUDUONG">Điều dưỡng</option>
                  <option value="THAISAN">Thai sản</option>
                  <option value="OM">Ốm đau</option>
                  <option value="KHAC">Khác</option>
                </optgroup>
              </select>
            </div>
            <div class="col-md-4 mb-3" id="groupMa">
              <label class="form-label fw-bold">Mã hạng mục (để lọc):</label>
              <input class="form-control" id="maCT" placeholder="VD: SCL1, SCL2, Gói 1">
            </div>
            <div class="col-md-4 mb-3" id="groupHangMuc">
              <label class="form-label fw-bold">Mô tả:</label>
              <input class="form-control" id="hangMuc" placeholder="VD: Thay cuộn cắt">
            </div>
          </div>
          <div class="row" id="groupTram">
            <div class="col-md-8 mb-3"><label class="form-label fw-bold">Trạm:</label><select class="form-select" id="tram"></select></div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">CT1 / CT2:</label>
              <select class="form-select" id="ctType"><option value="">Tự động</option><option value="CT1">CT1</option><option value="CT2">CT2</option></select>
              <small class="text-muted d-none" id="baoLocHint">⚠️ Bảo Lộc: không tính CT</small>
            </div>
          </div>
          <div id="sectionWork" class="border rounded p-3 mb-3 bg-light">
            <h6 class="fw-bold text-primary mb-3">🛠️ Công tác & Di chuyển</h6>
            <div class="row">
              <div class="col-12"><label class="fw-bold small text-warning">🚗 Di chuyển ĐI (Tự động +3h nếu để trống giờ đến)</label></div>
              <div class="col-md-6 mb-2"><input type="datetime-local" class="form-control" id="dcDiTu" onchange="autoPlus3h('dcDiTu', 'dcDiDen')"></div>
              <div class="col-md-6 mb-2"><input type="datetime-local" class="form-control" id="dcDiDen"></div>
            </div>
            <div class="row">
              <div class="col-12"><label class="fw-bold small text-success">🔧 Công tác</label></div>
              <div class="col-md-6 mb-2"><input type="datetime-local" class="form-control" id="gioBD"></div>
              <div class="col-md-6 mb-2"><input type="datetime-local" class="form-control" id="gioKT"></div>
            </div>
            <div class="row">
              <div class="col-12"><label class="fw-bold small text-warning">🚗 Di chuyển VỀ (Tự động +3h nếu để trống giờ đến)</label></div>
              <div class="col-md-6 mb-2"><input type="datetime-local" class="form-control" id="dcVeTu" onchange="autoPlus3h('dcVeTu', 'dcVeDen')"></div>
              <div class="col-md-6 mb-2"><input type="datetime-local" class="form-control" id="dcVeDen"></div>
            </div>
          </div>
          <div id="sectionLeave" class="border rounded p-3 mb-3 bg-light d-none">
            <h6 class="fw-bold text-warning mb-3">🌴 Thời gian nghỉ (chỉ chọn ngày)</h6>
            <div class="row">
              <div class="col-md-4 mb-2"><label class="form-label small fw-bold">Từ ngày:</label><input type="date" class="form-control" id="leaveFrom"></div>
              <div class="col-md-4 mb-2"><label class="form-label small fw-bold">Đến ngày:</label><input type="date" class="form-control" id="leaveTo"></div>
              <div class="col-md-4 mb-2 d-none" id="groupNghiBu">
                <label class="form-label small fw-bold">Số giờ bù:</label>
                <input type="number" class="form-control" id="leaveHours" step="0.5" min="0">
                <small class="text-muted">Mặc định 8h × số ngày</small>
              </div>
            </div>
          </div>
          <div class="mb-3"><label class="form-label fw-bold">Ghi chú:</label><input class="form-control" id="ghiChu"></div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg px-5" id="btnSave">💾 Lưu</button>
            <button type="button" class="btn btn-outline-secondary btn-lg" onclick="resetForm()">🔄 Làm mới</button>
          </div>
          <div id="msg" class="text-center mt-3"></div>
        </form>
      </div>
    </div>

    <!-- BẢNG THÁNG BỔ SUNG CỘT QUỸ -->
    <div class="tab-pane fade" id="thang">
      <div class="card p-3">
        <div class="row g-2 align-items-end mb-3">
          <div class="col-6 col-md-2"><label class="form-label">Tháng</label><input type="month" class="form-control" id="fMonth"></div>
          <div class="col-12 col-md-4 mt-2 mt-md-0">
            <label class="form-label">Xem theo mã</label>
            <select class="form-select" id="fViewCode">
              <option value="ALL">Tất cả (Tổng hợp)</option>
              <option value="SANXUAT">Sản xuất (SX)</option>
              <option value="SCL">SCL tổng</option>
              <option value="DTXD">ĐTXD tổng</option>
              <option value="CT">CT</option>
              <optgroup label="— Mã cụ thể —" id="optCodes"></optgroup>
            </select>
          </div>
          <div class="col-6 col-md-2 mt-2 mt-md-0"><button class="btn btn-primary w-100" onclick="loadMonth()">🔍 Xem</button></div>
          <div class="col-12 col-md-4 mt-2 mt-md-0"><button class="btn btn-success w-100" onclick="exportMonth()">📊 Xuất Excel tháng</button></div>
        </div>
        <div id="warnBox"></div>
        <div class="table-responsive">
          <table class="table table-bordered table-sm mb-0" id="monthTable">
            <thead class="table-dark" id="monthHead"></thead>
            <tbody id="monthBody"><tr><td class="text-center text-muted">Chọn tháng và bấm "Xem"</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="caidat">
      <div class="card p-3">
        <h5 class="fw-bold">📅 Ngày lễ Tết</h5>
        <div id="holidayList" class="mb-3"></div>
        <div class="row g-2">
          <div class="col-md-4"><input type="date" class="form-control" id="newHolDate"></div>
          <div class="col-md-5"><input class="form-control" id="newHolName" placeholder="Tên lễ"></div>
          <div class="col-md-3"><button class="btn btn-primary w-100" onclick="addHoliday()">➕ Thêm</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API = "DAN_URL_WEB_APP_MOI_VAO_DAY"; // <-- Dán URL Web App vào đây
const LEAVE_TYPES = ['P','H','NGHIBU','DIEUDUONG','THAISAN','OM','KHAC'];
const LS_KEY = 'timesheet_form_cache_v3';
let CONFIG = { staff:[], stations:[], holidays:[], codes:[] };
let cachedMonth = null;

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fMonth').value = new Date().toISOString().slice(0,7);
  loadConfig();
  bindForm();
});

function loadConfig() {
  fetch(API + '?action=getConfig').then(async r => {
    const text = await r.text();
    try { return JSON.parse(text); } catch (e) { throw new Error("API không trả về JSON. Hãy kiểm tra URL hoặc Deploy."); }
  }).then(cfg => {
    if (cfg.error) throw new Error(cfg.error);
    CONFIG = cfg;
    renderEmpGrid(cfg.staff || []);
    renderStations(cfg.stations || []);
    renderCodes(cfg.codes || []);
    renderHolidays(cfg.holidays || []);
    try { restoreFormCache(); } catch (e) { localStorage.removeItem(LS_KEY); }
  }).catch(err => alert('Lỗi tải cấu hình:\n' + err.message));
}

function renderEmpGrid(staff) {
  document.getElementById('empGrid').innerHTML = staff.map(s =>
    `<label class="emp-chip" data-id="${s.id}" title="${s.name}"><input type="checkbox" value="${s.id}"><span>${s.short}</span></label>`
  ).join('');
  document.querySelectorAll('#empGrid input').forEach(cb => {
    cb.addEventListener('change', e => {
      e.target.closest('.emp-chip').classList.toggle('checked', e.target.checked);
      updateSelectedCount(); saveFormCache();
    });
  });
}
function renderStations(stations) { document.getElementById('tram').innerHTML = '<option value="">— Chọn —</option>' + stations.map(s => `<option>${s}</option>`).join(''); }
function renderCodes(codes) { document.getElementById('optCodes').innerHTML = codes.map(c => `<option value="${c}">${c}</option>`).join(''); }
function renderHolidays(hs) {
  const box = document.getElementById('holidayList');
  if (!hs || !hs.length) { box.innerHTML = '<p class="text-muted">Chưa có</p>'; return; }
  box.innerHTML = '<table class="table table-sm table-bordered"><thead><tr><th>Ngày</th><th>Tên</th><th></th></tr></thead><tbody>' +
    hs.map(h => `<tr><td>${h.date}</td><td>${h.name}</td><td><button class="btn btn-sm btn-danger" onclick="delHoliday('${h.date}')">Xóa</button></td></tr>`).join('') + '</tbody></table>';
}
function toggleAll(v) {
  document.querySelectorAll('#empGrid input').forEach(cb => { cb.checked = v; cb.closest('.emp-chip').classList.toggle('checked', v); });
  updateSelectedCount(); saveFormCache();
}
function updateSelectedCount() { document.getElementById('cntSelected').textContent = document.querySelectorAll('#empGrid input:checked').length; }
function autoPlus3h(fromId, toId) {
  const fromVal = document.getElementById(fromId).value; const toEl = document.getElementById(toId);
  if (fromVal && !toEl.value) {
    const d = new Date(fromVal); d.setHours(d.getHours() + 3);
    const pad = n => String(n).padStart(2, '0');
    toEl.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
}
function saveFormCache() {
  const cache = {
    selectedStaff: Array.from(document.querySelectorAll('#empGrid input:checked')).map(c=>c.value),
    loaiCT: document.getElementById('loaiCT').value, maCT: document.getElementById('maCT').value,
    hangMuc: document.getElementById('hangMuc').value, tram: document.getElementById('tram').value,
    ctType: document.getElementById('ctType').value, ghiChu: document.getElementById('ghiChu').value,
    leaveFrom: document.getElementById('leaveFrom').value, leaveTo: document.getElementById('leaveTo').value, leaveHours: document.getElementById('leaveHours').value,
  };
  localStorage.setItem(LS_KEY, JSON.stringify(cache));
}
function restoreFormCache() {
  const raw = localStorage.getItem(LS_KEY); if (!raw) return; const c = JSON.parse(raw);
  if (c.selectedStaff && c.selectedStaff.length) {
    document.querySelectorAll('#empGrid input').forEach(cb => {
      if (c.selectedStaff.includes(cb.value)) { cb.checked = true; cb.closest('.emp-chip').classList.add('checked'); }
    });
    updateSelectedCount();
  }
  if (c.loaiCT) document.getElementById('loaiCT').value = c.loaiCT;
  if (c.maCT) document.getElementById('maCT').value = c.maCT;
  if (c.hangMuc) document.getElementById('hangMuc').value = c.hangMuc;
  if (c.tram) document.getElementById('tram').value = c.tram;
  if (c.ctType) document.getElementById('ctType').value = c.ctType;
  if (c.ghiChu) document.getElementById('ghiChu').value = c.ghiChu;
  if (c.leaveFrom) document.getElementById('leaveFrom').value = c.leaveFrom;
  if (c.leaveTo) document.getElementById('leaveTo').value = c.leaveTo;
  if (c.leaveHours) document.getElementById('leaveHours').value = c.leaveHours;
  onLoaiChange(); checkBaoLoc();
}
function bindForm() {
  ['loaiCT','maCT','hangMuc','tram','ctType','ghiChu','leaveFrom','leaveTo','leaveHours'].forEach(id => {
    document.getElementById(id).addEventListener('change', saveFormCache);
    document.getElementById(id).addEventListener('input', saveFormCache);
  });
  document.getElementById('loaiCT').addEventListener('change', onLoaiChange);
  document.getElementById('tram').addEventListener('change', checkBaoLoc);
  document.getElementById('leaveFrom').addEventListener('change', autoHours);
  document.getElementById('leaveTo').addEventListener('change', autoHours);
  document.getElementById('frm').addEventListener('submit', onSubmit);
  onLoaiChange();
}
function onLoaiChange() {
  const loai = document.getElementById('loaiCT').value; const isLeave = LEAVE_TYPES.includes(loai);
  document.getElementById('sectionWork').classList.toggle('d-none', isLeave);
  document.getElementById('sectionLeave').classList.toggle('d-none', !isLeave);
  document.getElementById('groupTram').classList.toggle('d-none', isLeave);
  document.getElementById('groupMa').classList.toggle('d-none', isLeave || loai === 'CT' || loai === 'SANXUAT');
  document.getElementById('groupHangMuc').classList.toggle('d-none', isLeave || loai === 'CT');
  document.getElementById('groupNghiBu').classList.toggle('d-none', loai !== 'NGHIBU');
  autoHours();
}
function autoHours() {
  if (document.getElementById('loaiCT').value !== 'NGHIBU') return;
  const from = document.getElementById('leaveFrom').value; const to = document.getElementById('leaveTo').value;
  if (from && to) { const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1; if (days > 0) document.getElementById('leaveHours').value = (days * 8).toFixed(1); }
}
function checkBaoLoc() {
  const t = document.getElementById('tram').value; const hint = document.getElementById('baoLocHint'); const ct = document.getElementById('ctType');
  if (t.includes('Bảo Lộc')) { hint.classList.remove('d-none'); ct.value=''; ct.disabled=true; } else { hint.classList.add('d-none'); ct.disabled=false; }
}
function resetForm() { document.getElementById('frm').reset(); toggleAll(false); document.getElementById('msg').innerHTML = ''; onLoaiChange(); }

function onSubmit(e) {
  e.preventDefault();
  const dsNV = Array.from(document.querySelectorAll('#empGrid input:checked')).map(c => c.value);
  if (!dsNV.length) { alert('Chọn ít nhất 1 nhân sự'); return; }
  const loai = document.getElementById('loaiCT').value; const isLeave = LEAVE_TYPES.includes(loai);
  const p = { action: 'addEntry', dsNV, loaiCT: loai, maCT: document.getElementById('maCT').value.trim(), hangMuc: document.getElementById('hangMuc').value.trim(), ghiChu: document.getElementById('ghiChu').value.trim() };
  if (isLeave) {
    p.leaveFrom = document.getElementById('leaveFrom').value; p.leaveTo   = document.getElementById('leaveTo').value;
    if (loai === 'NGHIBU') p.leaveHours = parseFloat(document.getElementById('leaveHours').value) || 0;
    if (!p.leaveFrom || !p.leaveTo) { alert('Chọn khoảng ngày'); return; }
    if (p.leaveFrom > p.leaveTo) { alert('Từ ngày ≤ đến ngày'); return; }
  } else {
    p.tram = document.getElementById('tram').value; p.ctType = document.getElementById('ctType').value;
    p.dcDiTu = document.getElementById('dcDiTu').value; p.dcDiDen = document.getElementById('dcDiDen').value;
    p.gioBD = document.getElementById('gioBD').value; p.gioKT = document.getElementById('gioKT').value;
    p.dcVeTu = document.getElementById('dcVeTu').value; p.dcVeDen = document.getElementById('dcVeDen').value;
    if (!p.tram) { alert('Chọn trạm'); return; }
    const pairs = [['DC đi', p.dcDiTu, p.dcDiDen], ['CT', p.gioBD, p.gioKT], ['DC về', p.dcVeTu, p.dcVeDen]];
    let hasValid = false;
    for (const [label, a, b] of pairs) {
      if ((a && !b) || (!a && b)) { alert(`Cặp "${label}" phải nhập cả 2 đầu`); return; }
      if (a && b) { if (new Date(b) <= new Date(a)) { alert(`Cặp "${label}": kết thúc phải sau bắt đầu`); return; } hasValid = true; }
    }
    if (!hasValid) { alert('Nhập ít nhất 1 cặp (DC đi / CT / DC về)'); return; }
  }
  const btn = document.getElementById('btnSave'); btn.disabled = true; btn.textContent = '⏳ Đang lưu...';
  fetch(API, { method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(p) })
  .then(r=>r.json()).then(d => {
    if (d.error) throw new Error(d.error);
    document.getElementById('msg').innerHTML = `<span class="text-success fw-bold">✅ ${d.message}</span>`;
    ['dcDiTu','dcDiDen','gioBD','gioKT','dcVeTu','dcVeDen'].forEach(id => document.getElementById(id).value = '');
  }).catch(err => alert('Lỗi: ' + err.message)).finally(() => { btn.disabled = false; btn.textContent = '💾 Lưu'; });
}

function onTabThang() { if (!cachedMonth) loadMonth(); }
function loadMonth() {
  const m = document.getElementById('fMonth').value; if (!m) { alert('Chọn tháng'); return; }
  const [year, month] = m.split('-').map(Number); const viewCode = document.getElementById('fViewCode').value;
  document.getElementById('monthBody').innerHTML = '<tr><td class="text-center text-primary">⏳ Đang tải...</td></tr>';
  fetch(API + '?' + new URLSearchParams({action:'getMonthData', year, month, viewCode})).then(r=>r.json()).then(data => {
    if (data.error) throw new Error(data.error);
    cachedMonth = data; renderMonth(data); renderWarn(data);
  }).catch(err => {
    document.getElementById('monthBody').innerHTML = `<tr><td colspan="40" class="text-danger text-center">Lỗi: ${err.message}</td></tr>`;
  });
}

function renderMonth(data) {
  const { year, month, days, holidays, staffRows } = data;
  const head = document.getElementById('monthHead'); const body = document.getElementById('monthBody');
  let h = '<tr><th style="min-width:50px">Mã</th><th style="min-width:70px">Tên</th>';
  for (let d = 1; d <= days; d++) {
    const dt = new Date(year, month-1, d); const dow = dt.getDay(); const iso = dt.toISOString().slice(0,10);
    let cls = 'col-day'; let label = d;
    if (holidays.includes(iso)) { cls += ' cell-le'; label = d + '🎉'; } else if (dow === 0) { cls += ' cell-cn'; label = d + 'CN'; } else if (dow === 6) { cls += ' cell-t7'; label = d + 'T7'; }
    h += `<th class="${cls}">${label}</th>`;
  }
  // Thêm 2 cột Quỹ
  h += `
    <th class="total-hdr">T.Ngày</th>
    <th class="total-hdr">T.Đêm</th>
    <th class="total-hdr">OT.Ngày</th>
    <th class="total-hdr">OT.Đêm</th>
    <th class="total-hdr">T.HS</th>
    <th class="total-hdr">CT1</th>
    <th class="total-hdr">CT2</th>
    <th class="total-hdr">T.DC</th>
    <th class="total-hdr" style="background:#f8d7da; color:#b02a37">Nghỉ Bù</th>
    <th class="total-hdr" style="background:#f8d7da; color:#b02a37">Quỹ Cũ</th>
    <th class="total-hdr" style="background:#f8d7da; color:#b02a37">Quỹ Mới</th>`;
  head.innerHTML = h;

  body.innerHTML = staffRows.map(r => {
    let tr = `<tr><td>${r.staffId}</td><td class="fw-bold">${r.shortName}</td>`;
    for (let d = 1; d <= days; d++) {
      const cell = r.cells[d] || '';
      const isLeave = /^(P|H|NB|ĐD|TS|Ố|KH)/.test(cell);
      const cls = cell ? (isLeave ? 'cell-leave' : 'cell-work') : '';
      tr += `<td class="${cls}">${cell}</td>`;
    }
    tr += `
      <td class="total-col">${r.totalDay.toFixed(1)}</td>
      <td class="total-col">${r.totalNight.toFixed(1)}</td>
      <td class="total-col">${r.otDay.toFixed(1)}</td>
      <td class="total-col">${r.otNight.toFixed(1)}</td>
      <td class="total-col">${r.totalCoef.toFixed(2)}</td>
      <td class="total-col">${r.ct1||''}</td>
      <td class="total-col">${r.ct2||''}</td>
      <td class="total-col">${r.travel.toFixed(1)}</td>
      <td class="quy-col text-danger">${r.nghiBuThangNay ? '-'+r.nghiBuThangNay.toFixed(1)+'h' : ''}</td>
      <td class="quy-col">${r.quyThangTruocConLai.toFixed(1)}h</td>
      <td class="quy-col">${r.quyHienTaiConLai.toFixed(1)}h</td>`;
    tr += '</tr>';
    return tr;
  }).join('');
}

function renderWarn(data) {
  const box = document.getElementById('warnBox'); const warns = data.warnings || [];
  if (!warns.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="alert alert-warning py-2 mb-2"><b>⚠️ ${warns.length} cảnh báo OT:</b> ` + warns.slice(0,6).map(w => w.text).join(' | ') + (warns.length > 6 ? ` ... +${warns.length-6}` : '') + '</div>';
}

function exportMonth() {
  if (!cachedMonth) { alert('Vui lòng bấm nút "🔍 Xem" để tải dữ liệu trước khi xuất Excel!'); return; }
  const { year, month, days, holidays, staffRows } = cachedMonth;
  const headers = ['Mã NV', 'Tên ngắn'];
  for (let d = 1; d <= days; d++) headers.push(String(d));
  headers.push('Tổng Ngày', 'Tổng Đêm', 'OT Ngày', 'OT Đêm', 'Tổng HS', 'CT1', 'CT2', 'Tổng DC', 'Nghỉ Bù', 'Quỹ Cũ', 'Quỹ Mới');

  const aoa = [headers];
  staffRows.forEach(r => {
    const row = [r.staffId, r.shortName];
    for (let d = 1; d <= days; d++) row.push(r.cells[d] || '');
    row.push(
      r.totalDay.toFixed(1), r.totalNight.toFixed(1), r.otDay.toFixed(1), r.otNight.toFixed(1), r.totalCoef.toFixed(2), r.ct1 || '', r.ct2 || '', r.travel.toFixed(1),
      r.nghiBuThangNay ? '-'+r.nghiBuThangNay.toFixed(1) : '', r.quyThangTruocConLai.toFixed(1), r.quyHienTaiConLai.toFixed(1)
    );
    aoa.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ThongKeThang');
  const wscols = [{wch:8}, {wch:15}]; for(let i=0; i<days; i++) wscols.push({wch:7}); for(let i=0; i<11; i++) wscols.push({wch:10});
  ws['!cols'] = wscols;
  XLSX.writeFile(wb, `BangChamCong_${year}_${String(month).padStart(2,'0')}.xlsx`);
}

function addHoliday() {
  const date = document.getElementById('newHolDate').value; const name = document.getElementById('newHolName').value.trim();
  if (!date || !name) { alert('Nhập đủ'); return; }
  fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'addHoliday', date, name})}).then(r=>r.json()).then(d=>{ if(d.error) alert(d.error); else { loadConfig(); cachedMonth=null; } });
}
function delHoliday(date) {
  if (!confirm('Xóa ' + date + '?')) return;
  fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'deleteHoliday', date})}).then(r=>r.json()).then(d=>{ if(d.error) alert(d.error); else { loadConfig(); cachedMonth=null; } });
}
