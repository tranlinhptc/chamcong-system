<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: Arial, sans-serif; padding: 10px; font-size: 13px; }
  h3 { margin: 8px 0 4px; color: #2c3e50; }
  label { display:block; margin-top:6px; font-weight:600; }
  input, select, textarea { width:100%; padding:4px; box-sizing:border-box; margin-top:2px; }
  .row2 { display:flex; gap:6px; }
  .row2 > div { flex:1; }
  button { padding:8px 12px; margin-top:10px; width:100%;
           background:#1a73e8; color:#fff; border:0; border-radius:4px; cursor:pointer; }
  button.gray { background:#5f6368; }
  .box { border:1px solid #ddd; border-radius:4px; padding:8px; margin-bottom:8px; }
  #msg { color: green; margin-top:6px; }
</style>
</head>
<body>

<div class="box">
  <h3>➕ Nhập công tác</h3>
  <label>Ngày (ngày công tác)</label>
  <input type="date" id="ngay">
  <div class="row2">
    <div>
      <label>Mã NV</label>
      <select id="manv"></select>
    </div>
    <div>
      <label>Loại CT</label>
      <select id="loaiCT">
        <option>SANXUAT</option><option>SCL</option><option>DTXD</option>
        <option>CT</option><option>H</option><option>P</option>
        <option>NGHIBU</option><option>DIEUDUONG</option>
        <option>THAISAN</option><option>OM</option><option>KHAC</option>
      </select>
    </div>
  </div>
  <div class="row2">
    <div><label>Mã CT</label><input id="maCT" placeholder="SCL1, GOI2…"></div>
    <div><label>Hạng mục</label><input id="hangMuc" placeholder="Thay cuộn cắt…"></div>
  </div>
  <label>Trạm</label>
  <ấtselect id="tram"></select>
  <label>CT1 / CT2</label>
  <select id="ctType"><option value="">--</option><option>CT1</option><option>CT2</option></select>

  <div class="row2">
    <div><label>Bắt đầu</label><input type="time" id="gioBD" value="07:00"></div>
    <div><label>Kết thúc</label><input type="time" id="gioKT" value="17:00"></div>
  </div>
  <div class="row2 Excel">
    <div><label>DC đi từ</label><input type="time" id="dcDiTu"></div>
    <div><label>DC đi đến</label><input type="time" id="dcDiDen"></div>
  </div>
  <div class="row2">
    <div><label>DC về từ</label><input type="time" id="dcVeTu"></div>
    <div><label>DC về đến</label><input type="time" id="dcVeDen"></div>
  </div>
  <label>Ghi chú</label>
  <input id="ghiChu">
  <button onclick="saveEntry()">Lưu công tác</button>
  <div id="msg"></div>
</div>

<div class="box">
  <h3>📤 Xuất Excel</h3>
  <div class="row2">
    <div><label>Từ ngày</label><input type="date" id="expFrom"></div>
    <div><label>Đến ngày</label><input type="date" id="expTo"></div>
  </div>
  <label>Loại công tác (để trống = tất cả)</label>
  <input id="expTypes" placeholder="SCL,DTXD,SANXUAT">
  <label>Mã NV (để trống = tất cả)</label>
  <input id="expNVs" placeholder="NV01,NV02">
  <button onclick="doExport()">Xuất Excel</button>
  <button class="gray" onclick="rebuild()">Tính lại toàn bộ</button>
</div>

<script>
  google.script.run.withSuccessHandler(init).getLists();

  function init(lists) {
    const selNV = document.getElementById('manv');
    selNV.innerHTML = '<option value="">--</option>' +
      lists.nhanvien.map(n => `<option value="${n.ma}">${n.ma} - ${n.ten}</option>`).join('');
    const selT = document.getElementById('tram');
    selT.innerHTML = '<option value="">--</option>' +
      lists.tram.map(t => `<option>${t}</option>`).join('');

    const today = new Date().toISOString().slice(0,10);
    document.getElementById('ngay').value = today;
    document.getElementById('expFrom').value = today.slice(0,8) + '01';
    document.getElementById('expTo').value = today;
  }

  function saveEntry() {
    const p = {
      ngay: document.getElementById('ngay').value,
      manv: document.getElementById('manv').value,
      loaiCT: document.getElementById('loaiCT').value,
      maCT: document.getElementById('maCT').value,
      hangMuc: document.getElementById('hangMuc').value,
      tram: document.getElementById('tram').value,
      ctType: document.getElementById('ctType').value,
      gioBD: document.getElementById('gioBD').value,
      gioKT: document.getElementById('gioKT').value,
      dcDiTu: document.getElementById('dcDiTu').value,
      dcDiDen: document.getElementById('dcDiDen').value,
      dcVeTu: document.getElementById('dcVeTu').value,
      dcVeDen: document.getElementById('dcVeDen').value,
      ghiChu: document.getElementById('ghiChu').value
    };
    if (!p.manv || !p.gioBD || !p.gioKT) {
      alert('Nhập thiếu thông tin!'); return;
    }
    google.script.run.withSuccessHandler(r => {
      document.getElementById('msg').textContent = '✅ Đã lưu dòng ' + r.row;
      setTimeout(() => document.getElementById('msg').textContent = '', 2000);
    }).addEntry(p);
  }

  function doExport() {
    const p = {
      fromDate: new Date(document.getElementById('expFrom').value),
      toDate: new Date(document.getElementById('expTo').value),
      types: document.getElementById('expTypes').value.split(',').map(s=>s.trim()).filter(Boolean),
      employees: document.getElementById('expNVs').value.split(',').map(s=>s.trim()).filter(Boolean)
    };
    google.script.run.withSuccessHandler(r => {
      window.open(r.url, '_blank');
    }).exportExcel(p);
  }

  function rebuild() {
    google.script.run.rebuildAll();
  }
</script>
</body>
</html>
