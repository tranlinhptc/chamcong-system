<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Công Tác - Tổ Thí Nghiệm</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #0056b3; }
        .spinner { display: none; text-align: center; margin-top: 10px; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nhập Giờ Làm Việc</h2>
    <form id="timeForm">
        <label>Nhân viên:</label>
        <select id="ten" required>
            <option value="">-- Chọn người --</option>
            <option value="Nguyễn Văn A">Nguyễn Văn A</option>
            <!-- Thêm đủ 24 người tại đây -->
        </select>

        <label>Ngày làm việc (Tính từ 6h sáng):</label>
        <input type="date" id="ngayLamViec" required>

        <label>Loại công tác:</label>
        <select id="loaiCongTac" required>
            <option value="Sản xuất">Sản xuất</option>
            <option value="SCL1">Sửa chữa lớn (SCL1)</option>
            <option value="ĐTXD1">Đầu tư Xây dựng (Gói 1)</option>
            <option value="Nghỉ phép (P)">Nghỉ phép (P)</option>
            <option value="Đi học (H)">Đi học (H)</option>
        </select>

        <label>Trạm biến áp:</label>
        <select id="tram" required>
            <option value="500kV Di Linh">500 kV Di Linh</option>
            <option value="220kV Bảo Lộc">220 kV Bảo Lộc</option>
            <!-- Thêm các trạm khác -->
        </select>

        <label>Bắt đầu làm việc (Ngày/Giờ):</label>
        <input type="datetime-local" id="batDau">

        <label>Kết thúc làm việc (Ngày/Giờ):</label>
        <input type="datetime-local" id="ketThuc">

        <label>Tổng thời gian di chuyển (giờ):</label>
        <input type="number" id="tgDiChuyen" step="0.5" value="0" min="0">

        <button type="submit">Lưu Dữ Liệu</button>
        <div class="spinner" id="spinner">Đang xử lý...</div>
    </form>
</div>

<script>
    document.getElementById('timeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('spinner').style.display = 'block';

        const data = {
            ten: document.getElementById('ten').value,
            ngayLamViec: document.getElementById('ngayLamViec').value,
            loaiCongTac: document.getElementById('loaiCongTac').value,
            tram: document.getElementById('tram').value,
            batDau: document.getElementById('batDau').value,
            ketThuc: document.getElementById('ketThuc').value,
            tgDiChuyen: document.getElementById('tgDiChuyen').value
        };

        // THAY LINK WEB APP CỦA BẠN VÀO ĐÂY
        const WEB_APP_URL = 'YOUR_WEB_APP_URL_HERE';

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(res => {
            alert('Thành công: ' + res.message);
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('timeForm').reset();
        })
        .catch(error => {
            alert('Lỗi: ' + error);
            document.getElementById('spinner').style.display = 'none';
        });
    });
</script>

</body>
</html>
