<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang chủ — Chấm công</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card" style="max-width:520px">
  <h1>🏠 Trang Chủ</h1>
  <p class="sub">Hệ thống chấm công & công tác</p>

  <div id="userBox" class="user-box">Đang tải...</div>

  <div style="display:grid; gap:10px">
    <button onclick="location.href='chamcong.html'"
            style="background:#1a73e8; padding:14px; font-size:15px">
      📋 Bảng chấm công
    </button>
    <button disabled style="background:#999; padding:14px; font-size:15px">
      📊 Báo cáo tổng hợp (GĐ 3)
    </button>
    <button disabled style="background:#999; padding:14px; font-size:15px">
      ✅ Duyệt báo cáo (GĐ 3)
    </button>
  </div>

  <button class="logout" onclick="doLogout()" style="margin-top:16px">Đăng xuất</button>
  <div id="msg" class="msg"></div>
</div>

<script src="api.js"></script>
<script>
  const token = sessionStorage.getItem('token');
  if (!token) location.href = 'index.html';

  async function loadUser() {
    try {
      const r = await API.getUserInfo(token);
      if (!r.ok) { location.href = 'index.html'; return; }
      sessionStorage.setItem('user', JSON.stringify(r.user));
      document.getElementById('userBox').innerHTML =
        `<b>👤 ${r.user.hoTen}</b><br>
         <span style="color:#666">Tên ĐN:</span> ${r.user.username}<br>
         <span style="color:#666">Email:</span> ${r.user.email}<br>
         <span style="color:#666">Vai trò:</span> <b style="color:${r.user.vaiTro==='approver'?'#2e7d32':'#1a73e8'}">${r.user.vaiTro}</b>`;
    } catch(e) {
      document.getElementById('userBox').textContent = 'Lỗi: ' + e.message;
    }
  }

  async function doLogout() {
    await API.logout(token);
    sessionStorage.clear();
    location.href = 'index.html';
  }

  loadUser();
</script>
</body>
</html>
